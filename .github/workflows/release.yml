name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next-version.outputs.tag }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the next version
        id: next-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(bash .github/scripts/decide-next-release-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish the release with grouped notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

  windows-app:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install the desktop dependencies
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: Stamp the release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: pnpm pkg set "version=${RELEASE_TAG#v}"

      - name: Build the Windows installer
        run: pnpm make

      - name: Attach the installer and update files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" out/make/squirrel.windows/x64/* --clobber

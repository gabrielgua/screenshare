changelog:
  exclude:
    labels:
      - release
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - feature
    - title: Enhancements
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bugfix
    - title: Refactors
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
